name: CI/CD - Execution Service NoSQL (Kubernetes Deploy + SonarQube)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: oficina-eks-cluster-v2
  ECR_REPOSITORY: oficina-execution-service

jobs:
  # 1) Build, Testes Automatizados (>= 80%) e Qualidade (SonarQube/SonarCloud)
  test-and-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci

      - name: Executar Testes Automatizados com Cobertura (>= 80%)
        run: npm run test:cov

      - name: Build da aplicação
        run: npm run build

      - name: Validação de Qualidade de Código (SonarCloud / SonarQube)
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

  # 2) Build da imagem Docker e Deploy Automatizado em Kubernetes (AWS EKS ou Kubernetes Kind no CI)
  build-and-deploy:
    needs: test-and-quality
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HAS_AWS_CREDENTIALS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem Docker do microsserviço
        run: |
          docker build -t oficina-execution-service:${{ github.sha }} -t oficina-execution-service:latest .

      - name: Configurar credenciais da AWS (EKS)
        if: env.HAS_AWS_CREDENTIALS == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Criar cluster Kubernetes (Kind) para Deploy Automatizado
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: oficina-k8s

      - name: Carregar imagem Docker no cluster Kubernetes
        run: |
          kind load docker-image oficina-execution-service:latest --name oficina-k8s

      - name: Aplicar manifestos Kubernetes (/k8s - MongoDB NoSQL + Execution Service + HPA) e testar Healthcheck
        run: |
          kubectl apply -f k8s/mongodb.yaml
          kubectl apply -f k8s/secret.yaml
          sed 's|538889416411.dkr.ecr.us-east-1.amazonaws.com/oficina-execution-service:latest|oficina-execution-service:latest|g' k8s/deployment.yaml | sed 's|imagePullPolicy: Always|imagePullPolicy: IfNotPresent|g' | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl rollout status deployment/execution-service --timeout=120s
          kubectl get deployments,pods,svc,hpa -o wide
