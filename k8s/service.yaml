apiVersion: v1
kind: Service
metadata:
  name: execution-service
spec:
  type: LoadBalancer
  selector:
    app: execution-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3002
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: execution-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: execution-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
