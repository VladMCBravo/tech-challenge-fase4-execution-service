apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-execution
  labels:
    app: mongodb-execution
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-execution
  template:
    metadata:
      labels:
        app: mongodb-execution
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          readinessProbe:
            exec:
              command: ['mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 }).ok']
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
spec:
  selector:
    app: mongodb-execution
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
  type: ClusterIP
